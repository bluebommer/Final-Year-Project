<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — ReadLite</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #080d18;
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .icon {
    color: #22d3ee;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
    max-width: 320px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  a {
    color: #080d18;
    background: #22d3ee;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18.36 6.64A9 9 0 0 1 20.77 15" />
      <path d="M6.16 6.16a9 9 0 1 0 12.68 12.68" />
      <path d="M12 2v4" />
      <path d="M2 2l20 20" />
    </svg>
    <h1>You're offline</h1>
    <p>This article hasn't been saved for offline reading yet. Save articles to your Library while you're online to read them anywhere.</p>
    <a href="/library">Go to Library</a>
  </div>
</body>
</html>
